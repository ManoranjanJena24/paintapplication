<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/ico" />
    <link href="styles.css" type="text/css" rel="stylesheet" />
    <!-- Add FontAwesome CDN for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.3.1.js"
        integrity="sha256-2Kfd9ahz42cQfpE4aLrZ9lD2dNlaxjepBxRFx4pK2+o=" crossorigin="anonymous"></script>
</head>

<body>

    <div class="field">
        <canvas id="canvas"></canvas>
        <div class="tools">
            <!-- <button onClick="undo_last()" type="button" class="button">Undo</button>
            <button onClick="redo_last()" type="button" class="button" id="redo">Redo</button>
             -->
             <button onClick="undo()" type="button" class="button">Undo</button>
            <button onClick="redo()" type="button" class="button" id="redo">Redo</button>
            <button onClick="clear_canvas()" type="button" class="button">Clear</button>
            <button onClick="toggleErase()" type="button" class="button" id="eraseButton">Erase</button>
            <button onClick="downloadCanvas()" type="button" class="button" id="eraseButton">Download</button>

            <!-- Updated buttons with FontAwesome icons -->
            <button onClick="saveToLocalStorage()" type="button" class="button"><i class="fas fa-save"></i> Save </button>
            <button onClick="loadFromLocalStorage()" type="button" class="button"><i class="fas fa-folder-open"></i> Load </button>

            <div onclick="change_color(this)" class="color-field" style="background:red;"></div>
            <div onclick="change_color(this)" class="color-field" style="background:blue;"></div>
            <div onclick="change_color(this)" class="color-field" style="background:green;"></div>
            <div onclick="change_color(this)" class="color-field" style="background:yellow;"></div>

            <input onInput="draw_color=this.value" type="color" class="color-picker">
            <input type="range" min="1" max="100" class="pen-range" onInput="draw_width=this.value">
        </div>
    </div>

</body>
<script src="main.js"></script>

</html>
